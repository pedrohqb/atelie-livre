[package]
name = "engine"
version = "0.1.0"
description = "Engine do Ateliê Livre: recursos, quadro, cenas"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
formats = { path = "../formats" }
font8x8 = "0.3"
png = "0.17"
ab_glyph = "0.2"
ttf-parser = "0.25"

[features]
default = ["embedded-fonts"]
# Substitutas livres das fontes do Creative Writer embutidas no programa
# (assets/fonts/); sem este recurso, só as do sistema.
embedded-fonts = []

[dev-dependencies]
tempfile = "3"
