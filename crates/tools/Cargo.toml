[package]
name = "tools"
version = "0.1.0"
description = "Ferramentas de linha de comando do Ateliê Livre"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "atelie-tools"
path = "src/main.rs"

[dependencies]
formats = { path = "../formats" }
engine = { path = "../engine" }
clap = { version = "4", features = ["derive", "env"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
